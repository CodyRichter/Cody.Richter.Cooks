name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: recipe_db
          POSTGRES_USER: recipe_user
          POSTGRES_PASSWORD: recipe_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U recipe_user -d recipe_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'true'
      DATABASE_URL: postgresql://recipe_user:recipe_password@localhost:5432/recipe_db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff==0.8.4
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (Postgres, schema built by Alembic, includes alembic check)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
