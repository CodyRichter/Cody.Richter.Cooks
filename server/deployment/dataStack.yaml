Resources:
  RecipesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: recipes
      AttributeDefinitions:
        - AttributeName: name
          AttributeType: S
      KeySchema:
        - AttributeName: name
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
