steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cooking-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/cooking-backend:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cooking-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cooking-backend:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'DEBUG=false,APP_NAME=Cody Richter Cooks API'
      - '--update-secrets'
      - 'SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest'


# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/cooking-backend:latest'

# Substitutions (can be overridden)
substitutions:
  _REGION: 'us-central1'
  _IMAGE_TAG: 'manual'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
