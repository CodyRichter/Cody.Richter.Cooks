# Backend release pipeline: build -> migrate -> deploy.
# Invoked by .github/workflows/deploy-backend.yml (on master) and by
# scripts/prod/deploy.sh (manual fallback). _IMAGE_TAG must be a git SHA.
steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}']

  # Run migrations with the exact image being released, before it takes traffic
  - id: migrate
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        gcloud run jobs deploy cooking-backend-migrate \
          --image 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}' \
          --region '${_REGION}' \
          --command sh --args migrate.sh \
          --max-retries 0 \
          --task-timeout 600s \
          --set-env-vars 'DEBUG=false' \
          --set-secrets 'DATABASE_URL=DATABASE_URL:latest,SECRET_KEY=SECRET_KEY:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest'
        gcloud run jobs execute cooking-backend-migrate --region '${_REGION}' --wait

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'cooking-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'DEBUG=false,APP_NAME=Cody Richter Cooks API,FRONTEND_URL=https://cooking.cody.richter.codes,API_PUBLIC_URL=https://cooking-backend-123919757857.us-central1.run.app,EMAIL_FROM_ADDRESS=support@cooking.cody.richter.codes'
      - '--update-secrets'
      - 'SECRET_KEY=SECRET_KEY:latest,DATABASE_URL=DATABASE_URL:latest,RESEND_API_KEY=RESEND_API_KEY:latest,TURNSTILE_SECRET_KEY=TURNSTILE_SECRET_KEY:latest'
      - '--labels'
      - 'git-sha=${_IMAGE_TAG}'

images:
  - 'gcr.io/$PROJECT_ID/cooking-backend:${_IMAGE_TAG}'

substitutions:
  _REGION: 'us-central1'
  _IMAGE_TAG: ''

options:
  logging: CLOUD_LOGGING_ONLY
